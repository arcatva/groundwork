version: 2
project_name: groundwork

builds:
  - main: ./cmd/groundwork
    binary: groundwork
    env: [CGO_ENABLED=0]
    # Claude Code's sandbox, which the evals run in, exists on macOS and Linux only.
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
